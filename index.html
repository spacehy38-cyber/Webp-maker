
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 WEBP 제작기</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#111827;color:#f9fafb;font-family:Arial,sans-serif}
.wrap{max-width:520px;margin:auto}
h2{text-align:center;margin:8px 0 22px}
.panel{background:#1f2937;padding:18px;border-radius:16px;margin-bottom:15px}
label{display:block;margin:13px 0 7px;color:#d1d5db;font-size:14px}
input,button{width:100%;padding:13px;border-radius:9px;border:1px solid #4b5563;background:#111827;color:white;font-size:16px}
input[type=file]{font-size:14px}
button{background:#2563eb;border:0;font-weight:bold;margin-top:16px}
button:disabled{background:#4b5563}
video{width:100%;max-height:260px;background:#000;border-radius:10px;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#status{font-size:14px;color:#93c5fd;line-height:1.5;word-break:break-word}
progress{width:100%;height:18px}
a{display:block;text-align:center;background:#059669;color:white;text-decoration:none;padding:14px;border-radius:9px;margin-top:14px;font-weight:bold}
small{color:#9ca3af}
</style>
</head>
<body>
<div class="wrap">
<h2>🎬 모바일 WEBP 제작기</h2>

<div class="panel">
<label>동영상 선택</label>
<input type="file" id="file" accept="video/*">
<video id="preview" controls playsinline></video>
</div>

<div class="panel">
<div class="grid">
<div>
<label>시작 시간</label>
<input id="start" value="0" placeholder="예: 1:36">
</div>
<div>
<label>종료 시간</label>
<input id="end" value="5" placeholder="예: 1:40">
</div>
<div>
<label>FPS</label>
<input id="fps" type="number" value="12" min="1" max="30">
</div>
<div>
<label>가로 크기(px)</label>
<input id="width" type="number" value="480" min="100" max="1920">
</div>
<div>
<label>화질 (1~100)</label>
<input id="quality" type="number" value="80" min="1" max="100">
</div>
</div>
<small>시간 입력 예: 90 / 5:30 / 1:36:13</small>
<button id="make">WEBP 만들기</button>
</div>

<div class="panel">
<div id="status">동영상을 선택하고 WEBP 만들기를 눌러주세요.</div>
<progress id="progress" value="0" max="100"></progress>
<a id="download" hidden>완성된 WEBP 저장</a>
</div>
</div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const $ = id => document.getElementById(id);
const ffmpeg = new FFmpeg();
let loaded = false;
let videoURL = null;
let outputURL = null;

function status(message){
  $("status").textContent = message;
}

function timeToSeconds(value){
  const parts = value.trim().split(":").map(Number);
  if(!parts.length || parts.some(n => !Number.isFinite(n) || n < 0)) {
    throw new Error("시간 형식을 확인해주세요.");
  }
  if(parts.length === 1) return parts[0];
  if(parts.length === 2) return parts[0]*60 + parts[1];
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  throw new Error("시간은 초, 분:초, 시:분:초 형식으로 입력해주세요.");
}

$("file").addEventListener("change", () => {
  const file = $("file").files[0];
  if(!file) return;
  if(videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(file);
  $("preview").src = videoURL;
  $("download").hidden = true;
  status("동영상 선택 완료!");
});

async function loadEngine(){
  if(loaded) return;

  status("1/3 변환 엔진 파일 다운로드 중...");
  const base = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";

  const coreURL = await toBlobURL(
    base + "/ffmpeg-core.js",
    "text/javascript"
  );

  status("2/3 WASM 엔진 다운로드 중...");

  const wasmURL = await toBlobURL(
    base + "/ffmpeg-core.wasm",
    "application/wasm"
  );

  status("3/3 변환 엔진 초기화 중...");

  const classWorkerURL = new URL(
    "./ffmpeg/worker.js",
    window.location.href
  ).href;

  await ffmpeg.load({
    coreURL,
    wasmURL,
    classWorkerURL
  });

  loaded = true;
}

ffmpeg.on("progress", ({ progress }) => {
  if(Number.isFinite(progress)){
    $("progress").value = Math.max(0,Math.min(100,progress*100));
  }
});

ffmpeg.on("log", ({ message }) => {
  if(message) console.log(message);
});

$("make").addEventListener("click", async () => {
  const file = $("file").files[0];
  if(!file){
    alert("먼저 동영상을 선택해주세요.");
    return;
  }

  const button = $("make");
  button.disabled = true;
  $("progress").value = 0;
  $("download").hidden = true;

  try{
    const start = timeToSeconds($("start").value);
    const end = timeToSeconds($("end").value);
    const duration = end - start;
    const fps = Math.max(1,Math.min(30,Number($("fps").value)));
    const width = Math.max(100,Math.min(1920,Number($("width").value)));
    const quality = Math.max(1,Math.min(100,Number($("quality").value)));

    if(duration <= 0) throw new Error("종료 시간은 시작 시간보다 커야 합니다.");

    await loadEngine();

    status("동영상 불러오는 중...");
    const inputName = "input_video";
    const outputName = "result.webp";

    await ffmpeg.writeFile(inputName, await fetchFile(file));

    status("WEBP 변환 중... 잠시 기다려주세요.");

    await ffmpeg.exec([
      "-ss", String(start),
      "-t", String(duration),
      "-i", inputName,
      "-vf", `fps=${fps},scale=${width}:-1:flags=lanczos`,
      "-an",
      "-c:v", "libwebp",
      "-quality", String(quality),
      "-loop", "0",
      outputName
    ]);

    status("완성 파일 준비 중...");
    const data = await ffmpeg.readFile(outputName);
    const blob = new Blob([data], {type:"image/webp"});

    if(outputURL) URL.revokeObjectURL(outputURL);
    outputURL = URL.createObjectURL(blob);

    const link = $("download");
    link.href = outputURL;
    link.download = "animated.webp";
    link.textContent = "완성된 WEBP 저장";
    link.hidden = false;

    $("progress").value = 100;
    status("변환 완료! 아래 버튼을 눌러 저장하세요.");

  }catch(error){
    console.error(error);
    status("오류 발생:\n" + String(error));
  }finally{
    button.disabled = false;
  }
});
</script>
</body>
</html>
