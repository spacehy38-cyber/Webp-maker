
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 WEBP 제작기</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#111827;color:white;font-family:Arial,sans-serif}
.wrap{max-width:520px;margin:auto}
h2{text-align:center}
.panel{background:#1f2937;padding:18px;border-radius:15px;margin:15px 0}
label{display:block;margin:12px 0 6px;color:#ddd}
input,button{width:100%;padding:13px;border-radius:9px;border:1px solid #4b5563;background:#111827;color:white;font-size:16px}
button{background:#2563eb;border:0;margin-top:18px;font-weight:bold}
button:disabled{background:#555}
video{width:100%;max-height:250px;margin-top:12px;background:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
progress{width:100%;height:18px}
#status{white-space:pre-wrap;word-break:break-word;color:#93c5fd;font-size:14px}
a{display:block;text-align:center;background:#059669;color:white;padding:14px;border-radius:9px;margin-top:14px;text-decoration:none}
small{color:#aaa}
</style>
</head>
<body>
<div class="wrap">
<h2>🎬 모바일 WEBP 제작기</h2>

<div class="panel">
<label>동영상 선택</label>
<input type="file" id="file" accept="video/*">
<video id="preview" controls playsinline></video>
</div>

<div class="panel">
<div class="grid">
<div><label>시작 시간</label><input id="start" value="0"></div>
<div><label>종료 시간</label><input id="end" value="5"></div>
<div><label>FPS</label><input id="fps" type="number" value="12" min="1" max="30"></div>
<div><label>가로 크기</label><input id="width" type="number" value="480" min="100" max="1920"></div>
<div><label>화질</label><input id="quality" type="number" value="80" min="1" max="100"></div>
</div>
<small>시간 입력: 90 / 5:30 / 1:36:13</small>
<button id="make">WEBP 만들기</button>
</div>

<div class="panel">
<div id="status">동영상을 선택해 주세요.</div>
<progress id="progress" value="0" max="100"></progress>
<a id="download" hidden>완성된 WEBP 저장</a>
</div>
</div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

const $ = id => document.getElementById(id);
const ffmpeg = new FFmpeg();

let loaded = false;
let videoURL = null;
let outputURL = null;

function status(message){
  $("status").textContent = message;
}

function toSeconds(value){
  const p = value.trim().split(":").map(Number);

  if(!p.length || p.some(n => !Number.isFinite(n) || n < 0)){
    throw new Error("시간 형식을 확인해 주세요.");
  }

  if(p.length === 1) return p[0];
  if(p.length === 2) return p[0]*60+p[1];
  if(p.length === 3) return p[0]*3600+p[1]*60+p[2];

  throw new Error("시간은 초, 분:초, 시:분:초로 입력해 주세요.");
}

$("file").addEventListener("change",()=>{
  const file = $("file").files[0];
  if(!file) return;

  if(videoURL) URL.revokeObjectURL(videoURL);

  videoURL = URL.createObjectURL(file);
  $("preview").src = videoURL;
  $("download").hidden = true;

  status("동영상 선택 완료!");
});

async function loadEngine(){
  if(loaded) return;

  status("1/3 변환 엔진 다운로드 중...");

  const base = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";

  status("2/3 WASM 엔진 다운로드 중...");

  const classWorkerURL = new URL(
    "./ffmpeg/worker.js",
    window.location.href
  ).href;

  status("3/3 엔진 초기화 중...");

  await ffmpeg.load({
    coreURL: base + "/ffmpeg-core.js",
    wasmURL: base + "/ffmpeg-core.wasm",
    classWorkerURL: classWorkerURL
  });

  loaded = true;
  status("엔진 준비 완료!");
}

ffmpeg.on("progress",({progress})=>{
  if(Number.isFinite(progress)){
    $("progress").value = Math.max(0,Math.min(100,progress*100));
  }
});

$("make").addEventListener("click",async()=>{
  const file = $("file").files[0];

  if(!file){
    alert("먼저 동영상을 선택해 주세요.");
    return;
  }

  const button = $("make");
  button.disabled = true;
  $("progress").value = 0;
  $("download").hidden = true;

  try{
    const start = toSeconds($("start").value);
    const end = toSeconds($("end").value);
    const duration = end-start;

    const fps = Math.max(1,Math.min(30,Number($("fps").value)));
    const width = Math.max(100,Math.min(1920,Number($("width").value)));
    const quality = Math.max(1,Math.min(100,Number($("quality").value)));

    if(duration <= 0){
      throw new Error("종료 시간은 시작 시간보다 커야 합니다.");
    }

    await loadEngine();

    status("동영상 불러오는 중...");

    await ffmpeg.writeFile(
      "input.mp4",
      new Uint8Array(await file.arrayBuffer())
    );

    status("WEBP 변환 중...");

    await ffmpeg.exec([
      "-ss",String(start),
      "-t",String(duration),
      "-i","input.mp4",
      "-vf",`fps=${fps},scale=${width}:-1:flags=lanczos`,
      "-an",
      "-c:v","libwebp",
      "-quality",String(quality),
      "-loop","0",
      "output.webp"
    ]);

    status("완성 파일 준비 중...");

    const data = await ffmpeg.readFile("output.webp");
    const blob = new Blob([data],{type:"image/webp"});

    if(outputURL) URL.revokeObjectURL(outputURL);

    outputURL = URL.createObjectURL(blob);

    $("download").href = outputURL;
    $("download").download = "animated.webp";
    $("download").hidden = false;

    $("progress").value = 100;
    status("변환 완료! 아래 버튼으로 저장하세요.");

  }catch(error){
    console.error(error);
    status("오류 발생:\n"+String(error));
  }finally{
    button.disabled = false;
  }
});
</script>
</body>
</html>
