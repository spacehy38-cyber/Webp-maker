
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 WEBP 제작기</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;
  background:#10131b;color:#f4f5f8;
  font-family:Arial,sans-serif
}
main{max-width:520px;margin:auto}
h2{text-align:center;margin:12px 0 22px}
.panel{
  background:#1b2130;border-radius:15px;
  padding:16px;margin-bottom:14px
}
label{display:block;margin:13px 0 7px;color:#cbd2df}
input,button{
  width:100%;padding:13px;border:0;
  border-radius:9px;font-size:16px
}
input{background:#30394c;color:white}
input[type=range]{padding:0}
button{
  background:#477cf5;color:white;
  font-weight:bold;margin-top:12px
}
button:disabled{opacity:.45}
video{width:100%;border-radius:10px;background:#000}
small{color:#aab3c4}
#status{white-space:pre-wrap;line-height:1.5}
progress{width:100%;height:14px}
a.download{
  display:block;text-align:center;
  padding:14px;background:#16865b;
  color:white;text-decoration:none;
  border-radius:9px;margin-top:12px;
  font-weight:bold
}
</style>
</head>
<body>
<main>
<h2>🎞 모바일 WEBP 제작기</h2>

<div class="panel">
  <label>동영상 선택</label>
  <input type="file" id="videoFile" accept="video/*">
  <video id="preview" controls playsinline></video>
  <small id="durationText">동영상을 선택해 주세요.</small>
</div>

<div class="panel">
  <label>시작 시간 (초 / 분:초 / 시:분:초)</label>
  <input id="start" value="0" placeholder="예: 5 또는 1:20">

  <label>종료 시간 (초 / 분:초 / 시:분:초)</label>
  <input id="end" value="5" placeholder="예: 10 또는 1:30">

  <label>FPS: <span id="fpsValue">12</span></label>
  <input id="fps" type="range" min="5" max="30" value="12">

  <label>가로 크기: <span id="widthValue">480</span>px</label>
  <input id="width" type="range" min="160" max="960" step="20" value="480">

  <label>화질: <span id="qualityValue">75</span></label>
  <input id="quality" type="range" min="20" max="100" value="75">

  <button id="loadBtn">① 변환 엔진 준비</button>
  <button id="makeBtn" disabled>② 움직이는 WEBP 만들기</button>
</div>

<div class="panel">
  <div id="status">준비 완료. 동영상을 선택해 주세요.</div>
  <progress id="progress" value="0" max="100"></progress>
  <a id="download" class="download" hidden>WEBP 저장하기</a>
</div>
</main>

<script type="module">
import { FFmpeg } from
"https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

const $ = id => document.getElementById(id);

const ffmpeg = new FFmpeg();

let loaded = false;
let inputURL = null;
let outputURL = null;
let selectedFile = null;

function status(message){
  $("status").textContent = message;
}

function parseTime(value){
  const parts = value.trim().split(":").map(Number);
  if(!parts.length || parts.some(n => !Number.isFinite(n) || n < 0)){
    throw new Error("시간 형식을 확인해 주세요.");
  }
  if(parts.length === 1) return parts[0];
  if(parts.length === 2) return parts[0]*60 + parts[1];
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  throw new Error("시간은 초, 분:초, 시:분:초 형식으로 입력해 주세요.");
}

function blobURL(url, type){
  return fetch(url).then(response => {
    if(!response.ok) throw new Error("파일 다운로드 실패: " + url);
    return response.blob();
  }).then(blob => URL.createObjectURL(
    new Blob([blob], {type})
  ));
}

$("fps").addEventListener("input", () => {
  $("fpsValue").textContent = $("fps").value;
});
$("width").addEventListener("input", () => {
  $("widthValue").textContent = $("width").value;
});
$("quality").addEventListener("input", () => {
  $("qualityValue").textContent = $("quality").value;
});

$("videoFile").addEventListener("change", event => {
  const file = event.target.files[0];
  if(!file) return;

  selectedFile = file;

  if(inputURL) URL.revokeObjectURL(inputURL);
  inputURL = URL.createObjectURL(file);

  $("preview").src = inputURL;
  $("preview").onloadedmetadata = () => {
    const duration = $("preview").duration;
    $("durationText").textContent =
      "영상 길이: " + duration.toFixed(2) + "초";
    $("end").value = Math.min(5, duration).toFixed(2);
  };

  $("download").hidden = true;
  status("동영상을 선택했습니다.");
});

ffmpeg.on("log", ({message}) => {
  if(message) status(message);
});

ffmpeg.on("progress", ({progress}) => {
  if(Number.isFinite(progress)){
    $("progress").value = Math.max(
      0, Math.min(100, Math.round(progress * 100))
    );
  }
});

$("loadBtn").addEventListener("click", async () => {
  if(loaded) {
    status("변환 엔진이 이미 준비되어 있습니다.");
    return;
  }

  $("loadBtn").disabled = true;
  status("변환 엔진 다운로드 중...\n처음에는 시간이 걸릴 수 있습니다.");

  try {
    const base =
      "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";

    const coreURL = await blobURL(
      base + "/ffmpeg-core.js",
      "text/javascript"
    );

    const wasmURL = await blobURL(
      base + "/ffmpeg-core.wasm",
      "application/wasm"
    );

    const classWorkerURL =
      location.origin + "/Webp-maker/ffmpeg/worker.js";

    await ffmpeg.load({
      coreURL,
      wasmURL,
      classWorkerURL
    });

    loaded = true;
    $("makeBtn").disabled = false;
    status("엔진 준비 완료! 동영상을 선택하고 WEBP를 만들어 주세요.");

  } catch(error) {
    console.error(error);
    status("엔진 준비 오류:\n" + (error.message || error));
    $("loadBtn").disabled = false;
  }
});

$("makeBtn").addEventListener("click", async () => {
  if(!loaded || !selectedFile) {
    status("먼저 동영상을 선택하고 엔진을 준비해 주세요.");
    return;
  }

  $("makeBtn").disabled = true;
  $("download").hidden = true;
  $("progress").value = 0;

  try {
    const start = parseTime($("start").value);
    const end = parseTime($("end").value);
    const duration = end - start;

    if(duration <= 0) throw new Error("종료 시간은 시작 시간보다 커야 합니다.");
    if(end > $("preview").duration + 0.1) {
      throw new Error("종료 시간이 영상 길이를 초과했습니다.");
    }

    const fps = Number($("fps").value);
    const width = Number($("width").value);
    const quality = Number($("quality").value);

    const ext = selectedFile.name.includes(".")
      ? selectedFile.name.split(".").pop().toLowerCase()
      : "mp4";

    const inputName = "input." + ext;
    const outputName = "result.webp";

    status("동영상 읽는 중...");
    const bytes = new Uint8Array(await selectedFile.arrayBuffer());

    await ffmpeg.writeFile(inputName, bytes);

    status("WEBP 변환 중...\n화면을 닫지 말고 기다려 주세요.");

    const result = await ffmpeg.exec([
      "-ss", String(start),
      "-t", String(duration),
      "-i", inputName,
      "-vf", `fps=${fps},scale=${width}:-1:flags=lanczos`,
      "-an",
      "-c:v", "libwebp",
      "-quality", String(quality),
      "-loop", "0",
      outputName
    ]);

    if(result !== 0) {
      throw new Error("변환에 실패했습니다. 영상 형식이나 구간을 확인해 주세요.");
    }

    const data = await ffmpeg.readFile(outputName);
    const blob = new Blob([data], {type:"image/webp"});

    if(outputURL) URL.revokeObjectURL(outputURL);
    outputURL = URL.createObjectURL(blob);

    const link = $("download");
    link.href = outputURL;
    link.download = "animated.webp";
    link.hidden = false;

    $("progress").value = 100;
    status("변환 완료!\n아래 WEBP 저장하기를 눌러 저장하세요.");

    await ffmpeg.deleteFile(inputName);
    await ffmpeg.deleteFile(outputName);

  } catch(error) {
    console.error(error);
    status("오류 발생:\n" + (error.message || error));
  } finally {
    $("makeBtn").disabled = false;
  }
});
</script>
</body>
</html>
